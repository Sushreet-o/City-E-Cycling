<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register Interest – Cit-E Cycling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .page-header {
            background: linear-gradient(135deg, #1a237e 0%, #1565c0 60%, #0288d1 100%);
            color: white; padding: 40px 0 30px;
        }
        .form-card { border: none; border-radius: 20px; box-shadow: 0 4px 30px rgba(0,0,0,.10); }
        .form-card .card-body { padding: 2.2rem; }
        .form-control, .form-select {
            border-radius: 10px; padding: .65rem 1rem;
            border: 1.5px solid #dee2e6;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,.15); }
        .form-control.is-invalid { border-color: #dc3545; }
        .btn-submit {
            background: linear-gradient(90deg, #1565c0, #0288d1);
            border: none; border-radius: 10px; padding: .7rem;
            font-size: 1rem; font-weight: 600;
            transition: opacity .2s, transform .1s;
        }
        .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
        .input-icon { position: relative; }
        .input-icon .bi {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: #9aa5b1; font-size: 1rem; pointer-events: none;
        }
        .input-icon .form-control { padding-left: 2.4rem; }
        .terms-box {
            background: #f8f9fa; border-radius: 12px;
            padding: 1rem 1.2rem;
            border: 1.5px solid #dee2e6;
        }
        .invalid-feedback { font-size: .82rem; }
    </style>
</head>
<body>

<div class="page-header">
    <div class="container">
        <a href="index.html" class="text-white text-decoration-none small opacity-75 mb-2 d-inline-block">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-person-plus-fill me-2"></i>Register Your Interest</h1>
        <p class="mb-0 mt-1 opacity-75 small">Sign up to hear about future Cit-E Cycling events</p>
    </div>
</div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card form-card">
                <div class="card-body">

                    <form action="register.php" method="POST" id="registerForm" novalidate>

                        <div class="mb-3">
                            <label for="firstname" class="form-label fw-semibold small">First Name</label>
                            <div class="input-icon">
                                <i class="bi bi-person"></i>
                                <input type="text" class="form-control" id="firstname"
                                       name="firstname" placeholder="e.g. Jane" required>
                            </div>
                            <div class="invalid-feedback">Please enter your first name.</div>
                        </div>

                        <div class="mb-3">
                            <label for="surname" class="form-label fw-semibold small">Surname</label>
                            <div class="input-icon">
                                <i class="bi bi-person-fill"></i>
                                <input type="text" class="form-control" id="surname"
                                       name="surname" placeholder="e.g. Smith" required>
                            </div>
                            <div class="invalid-feedback">Please enter your surname.</div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-icon">
                                <i class="bi bi-envelope"></i>
                                <input type="email" class="form-control" id="email"
                                       name="email" placeholder="e.g. jane@email.com" required>
                            </div>
                            <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>

                        <div class="terms-box mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="terms" value="yes" id="terms" required>
                                <label class="form-check-label small" for="terms">
                                    I accept the <a href="#" class="text-primary">terms and conditions</a>
                                    of the Cit-E Cycling events programme.
                                </label>
                                <div class="invalid-feedback">You must accept the terms to continue.</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-submit btn-primary w-100 text-white">
                            <i class="bi bi-send-fill me-1"></i> Submit Registration
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Bootstrap client-side validation
document.getElementById('registerForm').addEventListener('submit', function(e) {
    if (!this.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
    }
    this.classList.add('was-validated');
});
</script>
</body>
</html>
